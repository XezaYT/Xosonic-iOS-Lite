name: Build Xosonic Lite iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    paths-ignore:
      - 'README.md'
      - '.gitignore'

jobs:
  build-ipa:
    name: Build & Package Xosonic-Lite-iOS.ipa
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build Archive (Unsigned for Sideloading)
        run: |
          xcodebuild -project XosonicLite.xcodeproj \
            -scheme XosonicLite \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/XosonicLite.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package into .ipa
        run: |
          mkdir -p Payload
          cp -r build/XosonicLite.xcarchive/Products/Applications/XosonicLite.app Payload/
          cp XosonicLite/Resources/AppIcon.png Payload/XosonicLite.app/AppIcon.png || true
          cp XosonicLite/Resources/AppIcon.png Payload/XosonicLite.app/AppIcon60x60@2x.png || true
          zip -r -q Xosonic-Lite-iOS.ipa Payload
          ls -lh Xosonic-Lite-iOS.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xosonic-Lite-iOS-IPA
          path: Xosonic-Lite-iOS.ipa
          if-no-files-found: error
